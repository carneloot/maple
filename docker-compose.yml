services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    expose:
      - "3472"
    env_file: .env
    environment:
      PORT: 3472
    depends_on:
      tinybird:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3472/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - dokploy-network

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:3472}
        VITE_MAPLE_AUTH_MODE: ${MAPLE_AUTH_MODE:-self_hosted}
    expose:
      - "80"
    networks:
      - dokploy-network

  ingest:
    build:
      context: ./apps/ingest
      dockerfile: Dockerfile
    expose:
      - "3474"
    env_file: .env
    environment:
      INGEST_PORT: 3474
      INGEST_FORWARD_OTLP_ENDPOINT: http://otel-collector:4318
      INGEST_FORWARD_TIMEOUT_MS: 10000
      INGEST_MAX_REQUEST_BODY_BYTES: 20971520
      INGEST_REQUIRE_TLS: "false"
    depends_on:
      otel-collector:
        condition: service_started
    networks:
      - dokploy-network

  otel-collector:
    build:
      context: ./otel
      dockerfile: Dockerfile
    expose:
      - "4317"
      - "4318"
      - "13133"
    env_file: .env
    environment:
      SD_API_HOST: api
      SD_API_PORT: 3472
      SD_INTERNAL_TOKEN: ${SD_INTERNAL_TOKEN:-maple-sd-dev-token}
    volumes:
      - otel-queue-data:/var/lib/otelcol/file_storage
    depends_on:
      api:
        condition: service_healthy
    networks:
      - dokploy-network

  tinybird:
    image: tinybirdco/tinybird-local:latest
    platform: linux/amd64
    expose:
      - "7181"
    environment:
      COMPATIBILITY_MODE: 1
    volumes:
      - tinybird-clickhouse:/var/lib/clickhouse
      - tinybird-redis:/redis-data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7181/"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - dokploy-network

volumes:
  otel-queue-data:
  tinybird-clickhouse:
  tinybird-redis:

networks:
  dokploy-network:
    external: true
